{% extends "base.html" %}
{% set nav = 'messages' %}
{% block title %}私信{% endblock %}

{% block content %}
<div class="page-head">
  <h1>私信</h1>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="adBtn">自动私信</button>
  <button class="btn ghost sm" id="arBtn">AI 自动回复</button>
  <button class="btn ghost sm" id="acBtn">评论回复</button>
  <span class="hint" id="acc-line"></span>
</div>

<div class="dm" id="dm">
  <aside class="dm-side" id="dmSide">
    <div class="dm-acc">
      <div class="avt sm" id="accAvt"></div>
      <div class="dm-acc-txt">
        <select id="accSel"></select>
        <span class="hint" id="accHint">选择要查看的账号</span>
      </div>
      <button class="btn ghost sm" id="refresh" title="刷新">⟳</button>
    </div>
    <div class="dm-search">
      <input id="dmq" type="search" placeholder="搜索会话 / 输入 UID 发起私信" autocomplete="off">
    </div>
    <div class="dm-list" id="sessList"><div class="dm-empty">加载中…</div></div>
  </aside>

  <section class="dm-main" id="dmMain">
    <div class="dm-hd" id="chatHd">
      <button class="btn ghost sm dm-back" id="dmBack">←</button>
      <div class="avt sm" id="peerAvt"></div>
      <b id="peerName">未选择会话</b>
      <a class="hint" id="peerLink" href="#" target="_blank" style="display:none">主页 ↗</a>
      <span class="sp"></span>
      <span class="hint" id="chatTip"></span>
    </div>
    <div class="dm-body" id="msgs"><div class="dm-empty">从左侧选择一个会话开始聊天</div></div>

    <div class="dm-input" id="dmInput" style="display:none">
      <div class="dm-tools">
        <button class="tbtn" id="emoBtn" type="button">😊 表情</button>
        <button class="tbtn" id="imgBtn" type="button">🖼 图片</button>
        <span class="hint" id="pickTip"></span>
        <span class="sp" style="flex:1"></span>
        <span class="hint" id="polTip"></span>
      </div>
      <div class="dm-panel" id="emoPanel" style="display:none"></div>
      <div class="dm-panel" id="imgPanel" style="display:none"></div>
      <textarea id="msgText" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <div class="dm-send"><button class="btn" id="sendBtn">发送</button></div>
    </div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script>

var ACCOUNTS=[], ACC=null, SESS=[], PEER=null, PICK_IMG=null, EMOJIS=[];
var Q='', TIMER=null;

function setAvt(el, face, name, cls){
  var box=document.getElementById(el);
  if(!box) return;
  var im=faceUrl(face);
  var ch=((name||'?').trim()||'?').slice(0,1);
  box.innerHTML=im
    ? '<img src="'+BP.esc(im)+'" onerror="this.remove()" alt=""><span class="fallback">'+BP.esc(ch)+'</span>'
    : '<span class="fallback">'+BP.esc(ch)+'</span>';
}
function fmtTime(ms){
  var d=new Date(ms||0);
  var now=new Date();
  var same=d.toDateString()===now.toDateString();
  var p=function(x){return (x<10?'0':'')+x};
  return same?(p(d.getHours())+':'+p(d.getMinutes()))
             :(p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()));
}

async function loadAccounts(){
  var d=await BP.api('/api/messages/accounts');
  ACCOUNTS=d.accounts||[];
  document.getElementById('accSel').innerHTML=ACCOUNTS.length?ACCOUNTS.map(function(a){
    return '<option value="'+a.id+'">'+BP.esc(accName(a))+(a.status==='ok'?'':'（登录失效）')+'</option>';
  }).join(''):'<option value="">请先添加账号</option>';
  if(ACCOUNTS.length){
    ACC=ACCOUNTS[0];
    setAvt('accAvt', accFace(ACC), accName(ACC));
    await loadSessions(true);
    loadMsgPolicy();
  }else{
    document.getElementById('accHint').textContent='还没有账号，先去「账号」页添加';
  }
}

async function loadMsgPolicy(){
  try{
    var d=await BP.api('/api/messages/policy');
    document.getElementById('polTip').textContent = d.unlimited
      ? ('今日已发 '+d.used+' 条')
      : ('今日已发 '+d.used+' / '+d.daily_limit+' 条 · 最小间隔 '+d.min_interval_sec+' 秒');
  }catch(e){}
}

async function loadSessions(silent){
  if(!ACC) return;
  var box=document.getElementById('sessList');
  if(!silent) box.innerHTML='<div class="dm-empty">加载中…</div>';
  try{
    var d=await BP.api('/api/messages/sessions?account_id='+ACC.id);
    SESS=d.sessions||[];
  }catch(e){
    if(!silent) box.innerHTML='<div class="dm-empty">'+BP.esc(e.message)+'</div>';
    return;
  }
  renderSessions();
}
function renderSessions(){
  var box=document.getElementById('sessList');
  var list=SESS.filter(function(s){
    if(!Q) return true;
    return ((s.uname||'')+' '+(s.talker_id||'')+' '+(s.last_msg||'')).toLowerCase().indexOf(Q.toLowerCase())>=0;
  });
  if(!list.length){
    box.innerHTML='<div class="dm-empty">'+(SESS.length?'没有匹配的会话':'还没有会话。顶部搜索框输入 UID 可以直接发起私信。')+'</div>';
    return;
  }
  box.innerHTML=list.map(function(s){
    return '<div class="dm-item'+(PEER&&PEER.talker_id===s.talker_id?' on':'')+'" data-t="'+BP.esc(s.talker_id)+'">'
      +'<div class="avt sm">'+(faceUrl(s.face)?('<img src="'+BP.esc(faceUrl(s.face))+'" onerror="this.remove()" alt="">'):'')
      +'<span class="fallback">'+BP.esc(((s.uname||'?').slice(0,1)))+'</span></div>'
      +'<div class="dm-i-main"><div class="dm-i-top"><b>'+BP.esc(s.uname||('UID '+s.talker_id))+'</b>'
      +'<span class="hint">'+fmtTime((s.ts||0)*1000)+'</span></div>'
      +'<div class="dm-i-last hint">'+BP.esc(s.last_msg||'')+'</div></div>'
      +(s.unread?'<i class="bdot on">'+(s.unread>99?'99+':s.unread)+'</i>':'')
      +'</div>';
  }).join('');
  box.querySelectorAll('.dm-item').forEach(function(el){
    el.onclick=function(){ openPeer(el.getAttribute('data-t')); };
  });
}

async function openPeer(talkerId){
  var s=SESS.filter(function(x){return String(x.talker_id)===String(talkerId)})[0]
    || {talker_id:talkerId, uname:'UID '+talkerId, face:''};
  PEER=s;
  document.getElementById('peerName').textContent=s.uname||('UID '+talkerId);
  setAvt('peerAvt', s.face, s.uname);
  var link=document.getElementById('peerLink');
  link.href='https://space.bilibili.com/'+talkerId;
  link.style.display='';
  document.getElementById('dmInput').style.display='';
  renderSessions();
  await loadMsgs();
}
async function loadMsgs(){
  if(!ACC||!PEER) return;
  var box=document.getElementById('msgs');
  try{
    var d=await BP.api('/api/messages/msgs?account_id='+ACC.id+'&talker_id='+encodeURIComponent(PEER.talker_id));
    var list=d.msgs||[];
    if(d.emojis&&d.emojis.length) EMOJIS=d.emojis;
    if(!list.length){ box.innerHTML='<div class="dm-empty">还没有消息，说点什么吧。</div>'; return; }
    box.innerHTML=list.map(function(m){
      var body=BP.esc(m.text||'').replace(/\n/g,'<br>');
      var img=m.img?('<img src="'+BP.esc(m.img)+'" style="max-width:180px;border-radius:8px">'):'';
      return '<div class="dm-msg'+(m.from_me?' me':'')+'">'
        +'<div class="dm-bub">'+img+body
        +'<span class="dm-t">'+BP.esc(fmtTime((m.ts||0)*1000))+'</span></div></div>';
    }).join('');
    box.scrollTop=box.scrollHeight;
    var last=list[list.length-1];
    if(last&&last.seqno){
      BP.api('/api/messages/read',{method:'POST',body:JSON.stringify({
        account_id:ACC.id, talker_id:PEER.talker_id, ack_seqno:last.seqno})}).catch(function(){});
    }
  }catch(e){
    box.innerHTML='<div class="dm-empty">'+BP.esc(e.message)+'</div>';
  }
}

async function sendMsg(){
  if(!ACC||!PEER) return;
  var t=document.getElementById('msgText');
  var v=(t.value||'').trim();
  if(!v&&!PICK_IMG){ BP.toast('请输入内容或选一张图片','err'); return; }
  var b=document.getElementById('sendBtn'); b.disabled=true;
  try{
    var body={account_id:ACC.id, talker_id:PEER.talker_id, text:v};
    if(PICK_IMG) body.img_code=PICK_IMG.code;
    await BP.api('/api/messages/send',{method:'POST',body:JSON.stringify(body)});
    t.value=''; PICK_IMG=null;
    document.getElementById('imgBtn').classList.remove('on');
    document.getElementById('pickTip').textContent='';
    document.getElementById('imgPanel').style.display='none';
    await loadMsgs(); loadSessions(true); loadMsgPolicy();
  }catch(e){ BP.toast(e.message,'err'); }
  b.disabled=false;
}
document.getElementById('sendBtn').onclick=sendMsg;
document.getElementById('msgText').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); }
});
document.getElementById('accSel').onchange=function(){
  ACC=ACCOUNTS.filter(function(a){return String(a.id)===this.value}.bind(this))[0]||null;
  setAvt('accAvt', accFace(ACC||{}), accName(ACC||{}));
  PEER=null;
  document.getElementById('dmInput').style.display='none';
  loadSessions(true);
};
document.getElementById('refresh').onclick=function(){ loadSessions(); loadMsgPolicy(); };

/* 搜索：匹配会话，或直接用 UID 发起私信 */
document.getElementById('dmq').addEventListener('input',function(){
  Q=this.value.trim(); renderSessions();
});
document.getElementById('dmq').addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  var v=this.value.trim();
  if(/^\d{3,}$/.test(v) && !SESS.filter(function(s){return String(s.talker_id)===v}).length){
    openPeer(v); BP.toast('已新建会话：UID '+v);
  }
});

/* 表情 */
document.getElementById('emoBtn').onclick=function(){
  var p=document.getElementById('emoPanel');
  if(p.style.display!=='none'){ p.style.display='none'; return; }
  if(!EMOJIS.length) EMOJIS=['[微笑]','[大笑]','[doge]','[点赞]','[爱心]','[鼓掌]','[思考]','[笑哭]','[生气]','[惊讶]','[哭泣]','[加油]'];
  p.innerHTML=EMOJIS.map(function(e){return '<span class="chip" data-e="'+e+'">'+e+'</span>'}).join('');
  p.querySelectorAll('.chip').forEach(function(c){
    c.onclick=function(){
      var t=document.getElementById('msgText');
      t.value+=c.getAttribute('data-e');
      t.focus(); p.style.display='none';
    };
  });
  p.style.display='';
};
document.getElementById('imgBtn').onclick=async function(){
  var p=document.getElementById('imgPanel');
  if(p.style.display!=='none'){ p.style.display='none'; return; }
  try{
    var d=await BP.api('/api/publish/covers');
    var list=d.covers||[];
    if(!list.length){ BP.toast('图片库是空的，先去投稿页的封面库上传','err'); return; }
    p.innerHTML='<p class="hint" style="margin:4px 0">选择一张图片发送（来自封面库）</p><div class="cv-grid">'
      +list.map(function(c){
          return '<div class="cv-it"><img src="'+c.url+'" alt="" data-code="'+c.code+'" style="max-height:90px;cursor:pointer">'
            +'<div class="cv-meta"><span class="mono">#'+c.code+'</span></div></div>';
        }).join('')+'</div>';
    p.querySelectorAll('img[data-code]').forEach(function(im){
      im.onclick=function(){
        PICK_IMG={code:im.getAttribute('data-code'), url:im.src};
        document.getElementById('pickTip').textContent='已选图片 #'+PICK_IMG.code;
        document.getElementById('imgBtn').classList.add('on');
        p.style.display='none';
      };
    });
    p.style.display='';
  }catch(e){ BP.toast(e.message,'err'); }
};

/* 自动化入口 */
document.getElementById('adBtn').onclick=function(){ location.href='/scheduler?auto=autodm'; };
document.getElementById('arBtn').onclick=function(){ location.href='/scheduler?auto=autoreply'; };
document.getElementById('acBtn').onclick=function(){ location.href='/scheduler?auto=autocomment'; };

loadAccounts().catch(function(e){ BP.toast(e.message,'err'); });
TIMER=setInterval(function(){ if(ACC) loadSessions(true); }, 30000);
</script>
{% endblock %}
