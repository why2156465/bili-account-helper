{% extends "base.html" %}
{% block title %}站内{% endblock %}

{% block content %}
<div class="wrap">
  <div class="wb-root" id="wbRoot">
    <div class="wb-top">
      <div class="wb-acc" id="accBtn" title="切换账号">
        <div class="avt" id="accAvt"></div>
        <span class="nm" id="accNm">选择账号</span> ▾
      </div>
      <div class="wb-search">
        <input id="q" placeholder="搜索视频 / BV 号 / UID" autocomplete="off" enterkeyhint="search">
        <span class="s-ic" id="qGo">🔍</span>
      </div>
    </div>
    <div id="view"><div class="wb-empty">加载中…</div></div>
  </div>

  <nav class="wb-tabs" id="wbTabs">
    <a data-t="home" href="#/home">🏠 首页</a>
    <a data-t="msg" href="#/msg">✉ 消息<i class="n" id="msgN" style="display:none"></i></a>
    <a data-t="me" href="#/me">👤 我的</a>
  </nav>

  <div class="modal-mask" id="accModal" style="display:none">
    <div class="modal" style="max-width:460px">
      <div class="hd">选择账号<span class="x" onclick="closeAcc()">×</span></div>
      <div class="bd"><div id="accList"></div>
        <p class="hint" style="margin-top:10px">账号资料可以到「账号」页点头像改成你自己的昵称/头像。</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>

var ACCS=[], ACC=null, VIDS=[], CUR=null, SELMID=null;

function faceOf(a){return (a&&(a.alias_face||a.face))||''}
function nmOf(a){return (a&&(a.alias_name||a.uname||a.mid))||''}
function img(u,cls){
  if(!u) return '';
  var src=u.indexOf('/api/')===0?u:('/api/img/proxy?u='+encodeURIComponent(u));
  return '<img'+(cls?(' class="'+cls+'"'):'')+' src="'+esc(src)+'" onerror="this.remove()" alt="">';
}
function setAvt(el,face,name){
  var b=document.getElementById(el); if(!b) return;
  b.innerHTML=img(face,'face')+'<span class="fallback">'+esc(((name||'?')[0]||'?')).toUpperCase()+'</span>';
}
function vcard(v){
  return '<div class="wb-card" data-bv="'+esc(v.bvid)+'">'
    +'<div class="wb-pic">'+img(v.pic)+'<span class="wb-dur">'+esc(v.duration||'')+'</span></div>'
    +'<div class="wb-title">'+esc(v.title||'')+'</div>'
    +'<div class="wb-up hint">'+esc(v.author||'')+(v.view?(' · '+v.view+' 播放'):'')+'</div></div>';
}
function bindCards(){
  document.querySelectorAll('[data-bv]').forEach(function(el){
    el.onclick=function(){ openVideo(el.getAttribute('data-bv')); };
  });
  document.querySelectorAll('[data-mid]').forEach(function(el){
    el.onclick=function(e){ e.stopPropagation(); openSpace(el.getAttribute('data-mid')); };
  });
}

/* ---------------- 账号 ---------------- */
async function loadAccs(){
  var d=await BP.api('/api/accounts');
  ACCS=d.accounts||[];
  document.getElementById('accList').innerHTML=ACCS.length?ACCS.map(function(a){
    return '<div class="wb-accrow" data-id="'+a.id+'">'
      +'<div class="avt">'+img(faceOf(a),'face')+'</div><b>'+esc(nmOf(a))+'</b>'
      +(a.status==='ok'?'':'<span class="hint">（登录失效）</span>')+'</div>';
  }).join(''):'<p class="hint">还没有账号，去「账号」页添加。</p>';
  document.querySelectorAll('.wb-accrow').forEach(function(el){
    el.onclick=function(){ pickAcc(parseInt(el.getAttribute('data-id'))); };
  });
  if(ACCS.length && !ACC) pickAcc(ACCS[0].id, true);
}
function pickAcc(id,silent){
  ACC=ACCS.filter(function(a){return a.id===id})[0]||null;
  if(!ACC) return;
  document.getElementById('accNm').textContent=nmOf(ACC);
  setAvt('accAvt',faceOf(ACC),nmOf(ACC));
  closeAcc();
  route();
}
function openAcc(){ document.getElementById('accModal').style.display=''; }
function closeAcc(){ document.getElementById('accModal').style.display='none'; }
document.getElementById('accBtn').onclick=openAcc;

/* ---------------- 路由 ---------------- */
function route(){
  if(!ACC) return;
  var h=(location.hash||'#/home').replace('#/','');
  var t=h.split('/')[0];
  document.querySelectorAll('#wbTabs a').forEach(function(a){
    a.classList.toggle('on',a.getAttribute('data-t')===t);
  });
  if(t==='msg') return viewMsg();
  if(t==='me') return viewMe();
  if(t==='v') return openVideo(h.split('/')[1],true);
  if(t==='space') return openSpace(h.split('/')[1],true);
  return viewHome();
}
window.addEventListener('hashchange',route);

/* ---------------- 首页推荐 ---------------- */
async function viewHome(){
  if(!ACC) return;
  var g=document.getElementById('view');
  g.innerHTML='<div class="wb-g" id="feedG"><div class="wb-empty" style="grid-column:1/-1">正在为你推荐…</div></div>';
  try{
    var d=await BP.api('/api/web/feed?account_id='+ACC.id+'&ps=24');
    VIDS=d.videos||[];
    document.getElementById('feedG').innerHTML=VIDS.length
      ? VIDS.map(vcard).join('')
      : '<div class="wb-empty" style="grid-column:1/-1">暂时没有推荐</div>';
    bindCards();
  }catch(e){
    document.getElementById('feedG').innerHTML=
      '<div class="wb-empty" style="grid-column:1/-1">'+esc(e.message)+'</div>';
  }
}

/* ---------------- 视频详情 ---------------- */
async function openVideo(bv,push){
  if(!ACC||!bv) return;
  if(!push) location.hash='#/v/'+bv;
  var box=document.getElementById('view');
  box.innerHTML='<div class="wb-empty">正在打开 '+esc(bv)+' …</div>';
  try{
    var d=await BP.api('/api/web/info?account_id='+ACC.id+'&bvid='+encodeURIComponent(bv));
    window._CUR=d;
    box.innerHTML='<div class="wb-h"><button class="wb-back" onclick="location.hash=\'#/home\'">‹ 返回</button></div>'
      +'<div class="wb-v"><div class="wb-vplayer">'+img(d.pic)+'</div>'
      +'<div class="wb-vmain"><h2>'+esc(d.title)+'</h2>'
      +'<div class="wb-vmeta hint">'+esc(d.author)+' · '+d.view+' 播放 · '+d.danmaku+' 弹幕</div>'
      +'<div class="wb-vacts">'
      +'<button class="btn ghost sm" onclick="doAct(\'like\')">👍 点赞 '+d.like+'</button>'
      +'<button class="btn ghost sm" onclick="doAct(\'coin\')">🪙 投币 '+d.coin+'</button>'
      +'<button class="btn ghost sm" onclick="doAct(\'fav\')">⭐ 收藏 '+d.favorite+'</button>'
      +'<button class="btn ghost sm" onclick="doAct(\'share\')">↗ 分享 '+d.share+'</button>'
      +'<button class="btn ghost sm" onclick="doAct(\'follow\')">＋ 关注</button>'
      +'</div>'
      +'<div class="wb-desc hint">'+esc(d.desc||'').replace(/\n/g,'<br>')+'</div></div></div>'
      +'<div class="wb-cmt"><div class="card-hd"><i class="dot"></i>评论</div>'
      +'<div class="wb-cmtbox"><input id="cmtIn" placeholder="发一条友善的评论" style="flex:1">'
      +'<button class="btn sm" id="cmtSend">发送</button></div>'
      +'<div id="cmtList"><div class="hint" style="margin:6px 0">加载中…</div></div></div>';
    document.getElementById('cmtSend').onclick=sendCmt;
    document.getElementById('cmtIn').addEventListener('keydown',function(e){
      if(e.key==='Enter') sendCmt();
    });
    loadCmts(d.bvid,d.aid);
  }catch(e){
    box.innerHTML='<div class="wb-h"><button class="wb-back" onclick="location.hash=\'#/home\'">‹ 返回</button></div>'
      +'<div class="wb-empty">'+esc(e.message)+'</div>';
  }
}
async function doAct(what){
  var d=window._CUR; if(!d) return;
  var body={account_id:ACC.id,bvid:d.bvid,aid:d.aid,act:what};
  if(what==='follow') body.mid=d.owner.mid;
  if(what==='coin') body.multiply=1;
  try{
    await BP.api('/api/web/act',{method:'POST',body:JSON.stringify(body)});
    BP.toast('操作成功');
    openVideo(d.bvid,true);
  }catch(e){ BP.toast(e.message,'err'); }
}
async function loadCmts(bv,aid){
  var box=document.getElementById('cmtList'); if(!box) return;
  try{
    var d=await BP.api('/api/web/replies?account_id='+ACC.id+'&bvid='+encodeURIComponent(bv)
      +'&aid='+encodeURIComponent(aid||''));
    var rs=d.replies||[];
    window._CMT={bvid:bv,aid:aid||'',count:d.count||0};
    box.innerHTML=rs.length?rs.map(function(c){
      return '<div class="wb-cmtit" data-rpid="'+c.rpid+'">'
        +'<div class="wb-cmtavt">'+img(c.face)+'</div>'
        +'<div class="wb-cmtmain"><div class="wb-cmtu">'+esc(c.uname)+'</div>'
        +'<div class="wb-cmtt">'+esc(c.text)+'</div>'
        +'<div class="wb-cmtacts">'
        +'<button class="tbtn" data-reply="'+c.rpid+'">回复</button> '
        +'<button class="tbtn" data-del="'+c.rpid+'">删除</button>'
        +(c.rcount?('<button class="tbtn" data-sub="'+c.rpid+'">展开 '+c.rcount+' 条</button>'):'')
        +'</div><div class="wb-sub" id="sub-'+c.rpid+'"></div></div></div>';
    }).join(''):'<div class="hint" style="margin:6px 0">还没有评论</div>';
    bindCmt(box);
  }catch(e){ box.innerHTML='<div class="hint">'+esc(e.message)+'</div>'; }
}
function bindCmt(host){
  host.querySelectorAll('[data-reply]').forEach(function(b){
    b.onclick=function(){
      var rpid=b.getAttribute('data-reply');
      var c=window._CMT||{};
      var box=document.getElementById('sub-'+rpid);
      if(!box) return;
      box.innerHTML='<div style="display:flex;gap:6px;margin-top:6px">'
        +'<input id="rin-'+rpid+'" placeholder="回复…" style="flex:1">'
        +'<button class="btn sm" id="rgo-'+rpid+'">发送</button></div>';
      document.getElementById('rgo-'+rpid).onclick=async function(){
        var v=document.getElementById('rin-'+rpid).value.trim();
        if(!v){ BP.toast('请输入内容','err'); return; }
        try{
          await BP.api('/api/web/reply/to',{method:'POST',body:JSON.stringify({
            account_id:ACC.id,bvid:c.bvid||'',aid:c.aid||'',rpid:rpid,root:rpid,text:v})});
          BP.toast('回复已发送'); box.innerHTML='';
        }catch(e){ BP.toast(e.message,'err'); }
      };
    };
  });
  host.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick=async function(){
      if(!confirm('删除这条评论？')) return;
      var c=window._CMT||{};
      try{
        await BP.api('/api/web/reply/delete',{method:'POST',body:JSON.stringify({
          account_id:ACC.id,bvid:c.bvid||'',aid:c.aid||'',rpid:b.getAttribute('data-del')})});
        BP.toast('已删除'); loadCmts(c.bvid||'',c.aid||'');
      }catch(e){ BP.toast(e.message,'err'); }
    };
  });
  host.querySelectorAll('[data-sub]').forEach(function(b){
    b.onclick=async function(){
      var root=b.getAttribute('data-sub');
      var c=window._CMT||{};
      var box=document.getElementById('sub-'+root);
      box.innerHTML='<div class="hint" style="margin:4px 0">加载中…</div>';
      try{
        var d=await BP.api('/api/web/replies/sub?account_id='+ACC.id
          +'&aid='+encodeURIComponent(c.aid||'')+'&root='+root);
        var rs=d.replies||[];
        box.innerHTML=rs.length?rs.map(function(r){
          return '<div class="wb-cmtit sub"><div class="wb-cmtavt">'+img(r.face)+'</div>'
            +'<div class="wb-cmtmain"><div class="wb-cmtu">'+esc(r.uname)+'</div>'
            +'<div class="wb-cmtt">'+esc(r.text)+'</div></div></div>';
        }).join(''):'<div class="hint">没有更多回复</div>';
      }catch(e){ box.innerHTML='<div class="hint">'+esc(e.message)+'</div>'; }
    };
  });
}
async function sendCmt(){
  var d=window._CUR; if(!d) return;
  var t=document.getElementById('cmtIn');
  var v=(t.value||'').trim();
  if(!v){ BP.toast('请输入评论内容','err'); return; }
  var b=document.getElementById('cmtSend'); b.disabled=true;
  try{
    await BP.api('/api/web/reply/add',{method:'POST',body:JSON.stringify({
      account_id:ACC.id,bvid:d.bvid,aid:d.aid,text:v})});
    t.value=''; BP.toast('评论已发送');
    loadCmts(d.bvid,d.aid);
  }catch(e){ BP.toast(e.message,'err'); }
  b.disabled=false;
}

/* ---------------- 空间 ---------------- */
async function openSpace(mid,push){
  if(!ACC||!mid) return;
  if(!push) location.hash='#/space/'+mid;
  var box=document.getElementById('view');
  box.innerHTML='<div class="wb-empty">加载中…</div>';
  try{
    var d=await BP.api('/api/web/space?account_id='+ACC.id+'&mid='+encodeURIComponent(mid));
    var i=d.info||{};
    box.innerHTML='<div class="wb-prof">'
      +'<div class="avt">'+img(i.face,'face')+'</div>'
      +'<div class="wb-profinfo"><b>'+esc(i.name||('UID '+mid))+'</b>'
      +'<div class="hint">'+esc(i.sign||'')+'</div>'
      +'<div class="hint">粉丝 '+i.fans+' · 关注 '+i.following+' · 稿件 '+i.archive+' · Lv'+i.level+'</div></div>'
      +'<button class="btn sm" id="spFollow">'+((d.relation||{}).follow?'已关注':'＋ 关注')+'</button></div>'
      +'<div class="wb-g">'+((d.videos||[]).length
          ? (d.videos||[]).map(vcard).join('')
          : '<div class="wb-empty" style="grid-column:1/-1">还没有公开投稿。</div>')+'</div>';
    bindCards();
    var fb=document.getElementById('spFollow');
    if(fb) fb.onclick=async function(){
      try{
        await BP.api('/api/web/space/follow',{method:'POST',body:JSON.stringify({
          account_id:ACC.id,mid:i.mid,act:((d.relation||{}).follow)?2:1})});
        BP.toast('操作成功'); openSpace(i.mid,true);
      }catch(e){ BP.toast(e.message,'err'); }
    };
  }catch(e){ box.innerHTML='<div class="wb-empty">'+esc(e.message)+'</div>'; }
}

/* ---------------- 消息 ---------------- */
async function viewMsg(){
  if(!ACC) return;
  var box=document.getElementById('view');
  box.innerHTML='<div class="wb-h"><button class="wb-back" onclick="location.hash=\'#/home\'">‹ 返回</button>'
    +'<b style="margin-left:8px">私信</b></div>'
    +'<div class="card"><div class="card-bd" id="mlBox"><p class="hint">加载中…</p></div></div>';
  try{
    var d=await BP.api('/api/messages/sessions?account_id='+ACC.id);
    var list=d.sessions||[];
    document.getElementById('mlBox').innerHTML=list.length?list.map(function(s){
      return '<div class="wb-accrow" data-talk="'+esc(s.talker_id)+'">'
        +'<div class="avt">'+img(s.face,'face')+'</div>'
        +'<div style="flex:1;min-width:0"><b>'+esc(s.uname||('UID '+s.talker_id))+'</b>'
        +'<div class="hint">'+esc(s.last_msg||'')+'</div></div>'
        +(s.unread?'<i class="bdot on">'+s.unread+'</i>':'')+'</div>';
    }).join(''):'<p class="hint">还没有会话</p>';
    document.querySelectorAll('[data-talk]').forEach(function(el){
      el.onclick=function(){ openChat(el.getAttribute('data-talk')); };
    });
  }catch(e){ document.getElementById('mlBox').innerHTML='<p class="hint">'+esc(e.message)+'</p>'; }
}
async function openChat(talker){
  SELMID=talker;
  var box=document.getElementById('view');
  box.innerHTML='<div class="wb-h"><button class="wb-back" onclick="viewMsg()">‹ 返回</button>'
    +'<b style="margin-left:8px">对话 · UID '+esc(talker)+'</b></div>'
    +'<div class="card"><div class="card-bd"><div class="dm-body" id="chatBd" '
    +'style="max-height:340px;overflow:auto"><div class="dm-empty">加载中…</div></div>'
    +'<div style="display:flex;gap:8px;margin-top:10px">'
    +'<input id="chatI" placeholder="输入消息…" style="flex:1">'
    +'<button class="btn" id="chatS">发送</button></div></div></div>';
  document.getElementById('chatS').onclick=sendChat;
  await loadChat();
}
async function loadChat(){
  if(!SELMID) return;
  try{
    var d=await BP.api('/api/messages/msgs?account_id='+ACC.id+'&talker_id='+encodeURIComponent(SELMID));
    var list=d.msgs||[];
    var b=document.getElementById('chatBd');
    b.innerHTML=list.length?list.map(function(m){
      return '<div class="dm-msg'+(m.from_me?' me':'')+'"><div class="dm-bub">'
        +esc(m.text||'').replace(/\n/g,'<br>')+'</div></div>';
    }).join(''):'<div class="dm-empty">还没有消息</div>';
    b.scrollTop=b.scrollHeight;
  }catch(e){
    document.getElementById('chatBd').innerHTML='<div class="dm-empty">'+esc(e.message)+'</div>';
  }
}
async function sendChat(){
  if(!SELMID) return;
  var i=document.getElementById('chatI');
  var v=(i.value||'').trim();
  if(!v){ BP.toast('请输入内容','err'); return; }
  try{
    await BP.api('/api/messages/send',{method:'POST',body:JSON.stringify({
      account_id:ACC.id,talker_id:SELMID,text:v})});
    i.value=''; loadChat();
  }catch(e){ BP.toast(e.message,'err'); }
}

/* ---------------- 我的 ---------------- */
async function viewMe(){
  if(!ACC) return;
  var box=document.getElementById('view');
  box.innerHTML='<div class="wb-h"><button class="wb-back" onclick="location.hash=\'#/home\'">‹ 返回</button>'
    +'<b style="margin-left:8px">我的</b></div>'
    +'<div class="seg" style="margin-bottom:10px">'
    +'<button id="mt-videos" class="on" onclick="meTab(\'videos\')">投稿</button>'
    +'<button id="mt-likes" onclick="meTab(\'likes\')">点赞</button>'
    +'<button id="mt-follows" onclick="meTab(\'follows\')">关注</button>'
    +'<button id="mt-history" onclick="meTab(\'history\')">观看记录</button>'
    +'</div><div id="mlCnt" class="hint" style="margin-bottom:8px"></div>'
    +'<div class="wb-g" id="mlBox"><div class="wb-empty" style="grid-column:1/-1">加载中…</div></div>';
  meTab('videos');
}
async function meTab(k){
  ['videos','likes','follows','history'].forEach(function(x){
    var b=document.getElementById('mt-'+x); if(b) b.classList.toggle('on',x===k);
  });
  var box=document.getElementById('mlBox');
  box.innerHTML='<div class="wb-empty" style="grid-column:1/-1">加载中…</div>';
  try{
    if(k==='videos'){
      var d=await BP.api('/api/web/mine?account_id='+ACC.id+'&pn=1&ps=24');
      var vs=d.videos||[];
      document.getElementById('mlCnt').textContent='共 '+d.total+' 个';
      box.innerHTML=vs.length?vs.map(function(v){
        return '<div class="wb-card" data-bv="'+esc(v.bvid)+'">'
          +'<div class="wb-pic">'+img(v.pic)+'</div>'
          +'<div class="wb-title">'+esc(v.title)+'</div>'
          +'<div class="wb-up hint">'+v.view+' 播放 · '
          +'<button class="tbtn" data-delarc="'+v.aid+'">删除</button></div></div>';
      }).join(''):'<div class="wb-empty" style="grid-column:1/-1">这个账号还没有投稿。</div>';
      bindCards();
      box.querySelectorAll('[data-delarc]').forEach(function(b){
        b.onclick=async function(e){
          e.stopPropagation();
          if(!confirm('确定删除该稿件？删除后不可恢复。')) return;
          try{
            await BP.api('/api/web/archive/delete',{method:'POST',body:JSON.stringify({
              account_id:ACC.id,aid:b.getAttribute('data-delarc')})});
            BP.toast('已删除'); meTab('videos');
          }catch(x){ BP.toast(x.message,'err'); }
        };
      });
    }else if(k==='likes'){
      var d2=await BP.api('/api/web/likes?account_id='+ACC.id+'&ps=20&pn=1');
      var vs2=d2.videos||[];
      document.getElementById('mlCnt').textContent='共 '+d2.total+' 个';
      box.innerHTML=vs2.length?vs2.map(vcard).join('')
        :'<div class="wb-empty" style="grid-column:1/-1">还没有点赞记录。</div>';
      bindCards();
    }else if(k==='follows'){
      var d3=await BP.api('/api/web/follows?account_id='+ACC.id+'&ps=30&pn=1');
      var us=d3.ups||[];
      document.getElementById('mlCnt').textContent='共 '+d3.total+' 个';
      box.innerHTML=us.length?us.map(function(u){
        return '<div class="wb-card" data-mid="'+u.mid+'">'
          +'<div class="wb-pic wb-round">'+img(u.face)+'</div>'
          +'<div class="wb-title">'+esc(u.uname)+'</div>'
          +'<div class="wb-up hint">'+esc(u.sign||'').slice(0,24)+'</div></div>';
      }).join(''):'<div class="wb-empty" style="grid-column:1/-1">还没有关注的人。</div>';
      bindCards();
    }else{
      var d4=await BP.api('/api/web/history?account_id='+ACC.id+'&ps=20');
      var vs4=d4.videos||[];
      document.getElementById('mlCnt').textContent='共 '+vs4.length+' 条';
      box.innerHTML=vs4.length?vs4.map(vcard).join('')
        :'<div class="wb-empty" style="grid-column:1/-1">还没有观看记录。</div>';
      bindCards();
    }
  }catch(e){
    box.innerHTML='<div class="wb-empty" style="grid-column:1/-1">'+esc(e.message)+'</div>';
  }
}

/* ---------------- 搜索 ---------------- */
async function doSearch(){
  var q=document.getElementById('q').value.trim();
  if(!q) return;
  if(/^BV[0-9A-Za-z]{10}$/.test(q)) return openVideo(q);
  if(/^\d{4,}$/.test(q)) return openSpace(q);
  var box=document.getElementById('view');
  box.innerHTML='<div class="wb-g"><div class="wb-empty" style="grid-column:1/-1">搜索中…</div></div>';
  try{
    var d=await BP.api('/api/web/feed?account_id='+ACC.id+'&ps=24');
    var vs=(d.videos||[]).filter(function(v){
      return (v.title||'').toLowerCase().indexOf(q.toLowerCase())>=0
        || (v.author||'').toLowerCase().indexOf(q.toLowerCase())>=0;
    });
    box.innerHTML='<div class="wb-g">'+(vs.length?vs.map(vcard).join('')
      :'<div class="wb-empty" style="grid-column:1/-1">当前推荐流里没有匹配「'+esc(q)+'」的结果'
      +'<br><span class="hint">可直接粘贴 BV 号或 UID 打开</span></div>')+'</div>';
    bindCards();
  }catch(e){ box.innerHTML='<div class="wb-empty">'+esc(e.message)+'</div>'; }
}
document.getElementById('qGo').onclick=doSearch;
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter') doSearch();
});

/* ---------------- 启动 ---------------- */
(async function(){
  try{ await loadAccs(); }
  catch(e){ document.getElementById('view').innerHTML='<div class="wb-empty">'+esc(e.message)+'</div>'; }
})();
</script>
{% endblock %}
